# Installed by build.sh to /usr/lib/tmpfiles.d/bluefin-ipa-var.conf.
#
# On an ostree/bootc system /var is HOST state, not image content. Whatever a
# build writes under /var is discarded -- `ostree container commit` clears it,
# and a freshly deployed host starts from an empty /var populated only by
# systemd-tmpfiles. So an RPM baked into the image can be fully installed and
# still have none of the directories its %files declares under /var.
#
# That is not theoretical. fulton, 2026-08-10: freeipa-client is in the image,
# `rpm -q freeipa-client` passes, and ipa-client-install still dies one missing
# directory at a time --
#   [Errno 2] No such file or directory: '/var/lib/ipa-client/sysrestore/sysrestore.state'
# and then, once that one is created by hand,
#   [Errno 2] No such file or directory: '/var/lib/ipa-client/pki/kdc-ca-bundle.pem'
# Enrollment had to be walked through by hand, mkdir by mkdir.
#
# freeipa-client ships NO tmpfiles.d rules of its own -- verified on fulton,
# `rpm -ql freeipa-client | grep tmpfiles` is empty -- so nothing upstream is
# going to recreate these. certmonger's RPM does declare its /var/lib
# directories, which is exactly the declaration ostree drops on the floor, so
# they are restated here too rather than assumed.
#
# Modes match what enrollment on fulton was left with: 0755 for the IPA client
# state, 0700 for certmonger, which stores CA state and request material.
#
# /var/lib/authselect is deliberately NOT here: it already exists on these
# hosts, so adding it would be a rule nobody has ever seen fire.

d /var/lib/ipa-client            0755 root root -
d /var/lib/ipa-client/sysrestore 0755 root root -
d /var/lib/ipa-client/pki        0755 root root -
d /var/lib/ipa                   0755 root root -
d /var/lib/certmonger            0700 root root -
d /var/lib/certmonger/cas        0700 root root -
d /var/lib/certmonger/local      0700 root root -
d /var/lib/certmonger/requests   0700 root root -

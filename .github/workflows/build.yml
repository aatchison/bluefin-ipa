name: build

on:
  schedule:
    # Upstream Bluefin builds early UTC; 12:00 gives it clearance.
    - cron: "0 12 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # One broken variant/channel should not hide the others' results.
      fail-fast: false
      matrix:
        variant: [bluefin, bluefin-dx]
        # Hosts track different channels: claudia3/judah are on :latest,
        # work-dev-2 is on :stable. Switching a host between channels is a
        # behaviour change, so build both rather than forcing a move.
        channel: [latest, stable]
        include:
          # fulton is a headless server on the ucore HCI image. Confirmed via
          # `bootc status`: ghcr.io/ublue-os/ucore-hci:stable. It is an explicit
          # include rather than another row in the cross product because it
          # tracks :stable only -- a ucore-hci:latest row would just fail.
          - variant: ucore-hci
            channel: stable

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # Bluefin images are large; the default runner fills up mid-pull.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Image metadata
        id: meta
        run: |
          {
            echo "image=${REGISTRY}/${{ github.repository_owner }}/${{ matrix.variant }}-ipa"
            # Date tags are channel-qualified: :latest-YYYYMMDD and
            # :stable-YYYYMMDD. An unqualified date would collide between
            # channels and make a pinned rollback ambiguous.
            echo "datetag=${{ matrix.channel }}-$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          podman build \
            --build-arg BASE_IMAGE="ghcr.io/ublue-os/${{ matrix.variant }}" \
            --build-arg BASE_TAG="${{ matrix.channel }}" \
            --build-arg VARIANT="${{ matrix.variant }}" \
            --tag "${{ steps.meta.outputs.image }}:${{ matrix.channel }}" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.datetag }}" \
            .

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      # podman and cosign do not share a credential store: podman writes
      # $XDG_RUNTIME_DIR/containers/auth.json, cosign (go-containerregistry)
      # reads ~/.docker/config.json. Both must be logged in independently, or
      # signing fails at the signature push with UNAUTHORIZED.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GHCR_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Push the immutable date tag first, sign that digest, and only then
      # push :latest -- which resolves to the same already-signed digest.
      # :latest is what every host follows, so it must never be reachable in
      # an unsigned state; a failure anywhere before the last step leaves the
      # fleet on the previous good image rather than on an unsigned new one.
      - name: Push date tag
        if: github.event_name != 'pull_request'
        id: push
        run: |
          podman push \
            --digestfile /tmp/digest \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.datetag }}"
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Promote channel tag
        if: github.event_name != 'pull_request'
        run: |
          podman push "${{ steps.meta.outputs.image }}:${{ matrix.channel }}"

      - name: Verify the published signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify --key cosign.pub \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
